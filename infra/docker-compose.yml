# Local dev: the vendored OpenViking service (see vendor/openviking, pinned to v0.4.21).
# Based on vendor/openviking/docker-compose.yml, trimmed to what we need for local dev:
# no Caddy reverse proxy (we don't need public HTTPS), no VikingBot.
#
# OPT-IN ONLY as of docs/decisions/0009: the app's default knowledge store is now a
# plain Postgres table (get_knowledge_store(), libs/openviking_client), not this
# service. Only start this if you're testing with KNOWLEDGE_STORE=openviking set -
# it is not needed for normal local dev anymore.
#
# NOTE (open item, T034): the image tag below is `latest`, not pinned to v0.4.21.
# OpenViking's Docker image tags (v0.4.14.2, v0.4.16.dev1, ...) don't line up with its
# git release tags 1:1, and no image tag matching v0.4.21 could be confirmed to exist
# at the time this was written. Revisit before this goes anywhere beyond local dev.
#
# Run from repo root: docker compose -f infra/docker-compose.yml up -d
# Health check once running: curl http://localhost:1933/health
#
# openviking-config/ov.conf sets server.auth_mode="api_key" with a placeholder
# root_api_key ("local-dev-root-key-changeme"). This is a local-dev-only value,
# checked into git deliberately (it protects nothing sensitive since the port is
# bound to 127.0.0.1 only, above) — replace it with a real generated key before
# this setup is ever used anywhere beyond your own machine.

services:
  openviking:
    image: ghcr.io/volcengine/openviking:latest
    container_name: org-harness-openviking
    ports:
      - "127.0.0.1:1933:1933"
    volumes:
      # ./openviking-config/ov.conf configures Ollama via host.docker.internal (Docker
      # Desktop's hostname for reaching services running on your Mac, e.g. Ollama on
      # localhost:11434) since "localhost" inside the container means the container
      # itself, not your Mac. Data/index files land in openviking-config/data/
      # (gitignored) since storage.workspace points there.
      - ./openviking-config:/app/.openviking
    environment:
      OPENVIKING_SERVER_PORT: "1933"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
