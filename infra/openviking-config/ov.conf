{
  "storage": {
    "workspace": "/app/.openviking/data"
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "model": "qwen3-embedding:0.6b",
      "api_base": "http://host.docker.internal:11434/v1",
      "dimension": 1024,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "litellm",
    "model": "ollama/qwen3.5:4b",
    "api_key": "no-key",
    "api_base": "http://host.docker.internal:11434",
    "temperature": 0.0,
    "max_retries": 2,
    "extra_request_body": {
      "num_ctx": 16384,
      "think": false
    }
  },
  "query_planner": {
    "provider": "litellm",
    "model": "ollama/guoxuter/ov_intent_analysis_sft:v7_q8",
    "api_key": "no-key",
    "api_base": "http://host.docker.internal:11434",
    "temperature": 0.0,
    "timeout": 60,
    "extra_request_body": {
      "think": false
    }
  },
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "local-dev-root-key-changeme"
  }
}
