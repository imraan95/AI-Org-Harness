[project]
name = "context-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "shared-schemas",
    "llm-router",
    "openviking-client",
    "knowledge-model",
]

[tool.uv.sources]
shared-schemas = { workspace = true }
llm-router = { workspace = true }
openviking-client = { workspace = true }
knowledge-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_agent"]
