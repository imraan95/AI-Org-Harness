[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Pinned <2 to keep the FastMCP API (v2 renamed it to MCPServer with a
    # different interface) - same pin vendor/openviking's own pyproject.toml
    # already uses, confirmed by installing "mcp" bare first and hitting
    # that exact deprecation error.
    "mcp<2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
