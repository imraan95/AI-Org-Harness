[project]
name = "harness-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openviking-client",
    "knowledge-model",
    "pyjwt[crypto]>=2.8",
]

[tool.uv.sources]
openviking-client = { workspace = true }
knowledge-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_api"]
