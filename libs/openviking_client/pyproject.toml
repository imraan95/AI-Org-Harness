[project]
name = "openviking-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "knowledge-model",
    "db",
]

[tool.uv.sources]
knowledge-model = { workspace = true }
db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openviking_client"]
