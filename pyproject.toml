[project]
name = "org-harness"
version = "0.1.0"
description = "AI Organisational Harness - Python workspace root"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/ingestion-service",
    "apps/context-agent",
    "apps/harness-api",
    "apps/mcp-server",
    "libs/*",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
