[project]
name = "org-harness"
version = "0.1.0"
description = "AI Organisational Harness - Python workspace root"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/ingestion-service",
    "apps/context-agent",
    "apps/harness-api",
    "apps/mcp-server",
    "libs/*",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
# Only collect our own code. vendor/openviking (added in T033) carries its
# own full test suite with its own dependencies we never install (loguru,
# typer, fastapi, etc. - we don't run upstream's tests, only our own
# integration tests against its running HTTP API) - without this, a plain
# `pytest`/`uv run pytest` recurses into vendor/ and fails on missing
# imports that have nothing to do with our code.
testpaths = ["apps", "libs", "scripts"]
norecursedirs = ["vendor", ".venv", "node_modules", ".git"]
