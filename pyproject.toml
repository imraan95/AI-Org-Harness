[project]
name = "org-harness"
version = "0.1.0"
description = "AI Organisational Harness - Python workspace root"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/ingestion-service",
    "apps/context-agent",
    "apps/harness-api",
    "apps/mcp-server",
    "libs/*",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["apps", "libs", "scripts"]
# "vendor" is harmless to keep even though vendor/openviking (T033) was
# removed in docs/decisions/0011 - kept in case anything is ever vendored
# again, since it previously carried a full separate test suite with
# dependencies we never install that a plain `pytest` would otherwise
# recurse into and fail on.
norecursedirs = ["vendor", ".venv", "node_modules", ".git"]
